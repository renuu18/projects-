<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar Test</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

.navbar{
    background:#1d2671;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:20px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.menu-btn{
    display:none;
    color:white;
    font-size:30px;
    cursor:pointer;
}

@media(max-width:768px){
    .menu-btn{
        display:block;
    }

    .nav-links{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        right:20px;
        background:#1d2671;
        padding:20px;
    }

    .nav-links.active{
        display:flex;
    }
}

.hero{
    text-align:center;
    margin-top:100px;
    font-size:30px;
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">MyLogo</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="menu-btn" id="menuBtn">☰</div>
</nav>

<script>
const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

menuBtn.addEventListener("click", function(){
    navLinks.classList.toggle("active");
});
</script>

</body>
</html>
